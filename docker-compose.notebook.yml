services:
  openhands:
    image: ghcr.io/openhands/openhands:latest
    container_name: ${OPENHANDS_CONTAINER_NAME:-vitalia_openhands}
    ports:
      - "${OPENHANDS_PORT:-3000}:3000"
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=docker.all-hands.dev/all-hands-ai/runtime:0.50-nikolaik
      - LLM_BASE_URL=http://${NO2_SERVER_IP}:${NO2_OLLAMA_PORT}/v1
      - LLM_MODEL=ollama/qwen2.5-coder-vitalia
      - LLM_API_KEY=ollama
      - WORKSPACE_MOUNT_PATH=/opt/workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/.openhands
      - ./:/opt/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: ${NOTEBOOK_DB_CONTAINER_NAME:-vitalia_db_local}
    ports:
      - "${NOTEBOOK_DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - vitalia_local_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ${NOTEBOOK_OLLAMA_CONTAINER_NAME:-vitalia_ollama_local}
    ports:
      - "${NOTEBOOK_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_local_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  vitalia_local_data:
  ollama_local_data:
