services:
  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:latest
    container_name: vitalia_openhands
    ports:
      - "3000:3000"
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=docker.all-hands.dev/all-hands-ai/runtime:0.50-nikolaik
      - LLM_BASE_URL=http://${NO2_SERVER_IP}:${NO2_OLLAMA_PORT}/v1
      - LLM_MODEL=ollama/qwen2.5-coder-vitalia
      - LLM_API_KEY=ollama
      - WORKSPACE_MOUNT_PATH=/opt/workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/.openhands
      - ./:/opt/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
